name: Pi 版本兼容性

on:
  push:
  pull_request:

jobs:
  compatibility:
    name: Pi ${{ matrix.pi-version }} (ubuntu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pi-version:
          - 0.85.1
          - 1.0.0
          - 1.3.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --ignore-scripts --package-lock=false --no-audit --no-fund @earendil-works/pi-coding-agent@${{ matrix.pi-version }}
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:pi-runtime

  daemon-loader:
    name: Gateway npm bootstrap (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.22.3
          - 26.x
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Load daemon shim from a packed node_modules install
        run: |
          tarball="$(npm pack --pack-destination "$RUNNER_TEMP" --silent)"
          mkdir -p node_modules/pi-wechat-session-hub
          tar -xzf "$RUNNER_TEMP/$tarball" -C node_modules/pi-wechat-session-hub --strip-components=1
          node node_modules/pi-wechat-session-hub/extensions/daemon-entry.mjs

  windows:
    name: Pi ${{ matrix.pi-version }} (windows)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        pi-version:
          - 0.85.1
          - 1.3.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --ignore-scripts --package-lock=false --no-audit --no-fund @earendil-works/pi-coding-agent@${{ matrix.pi-version }}
      - run: npm run typecheck
      - run: npm test
      - name: 校验可见 UI 模式前置能力探测
        run: npm run test:wt-capability
